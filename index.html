<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人專屬 - 新海誠風格 AI 插畫生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #060b14 0%, #0c1524 100%);
            color: #f3f4f6;
            min-height: 100vh;
        }
        .gemini-glow { box-shadow: 0 0 25px rgba(56, 189, 248, 0.2); }
        .sky-bg { background: linear-gradient(to bottom, #111827, #030712); }
        .image-stage { aspect-ratio: 4 / 5; }
        textarea { resize: vertical; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 text-center border-b border-slate-800 pb-6">
            <div class="inline-block px-3 py-1 bg-sky-500/10 text-sky-400 text-xs rounded-full font-mono mb-2 border border-sky-500/20">Gemini 2.5 Flash Image Edition</div>
            <h1 class="text-3xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-indigo-300 to-purple-400">
                新海誠風格 AI 插畫生成器 (個人專屬版)
            </h1>
            <p class="text-slate-400 mt-2 text-xs md:text-sm">
                上傳照片後，將人物轉換成可愛、纖瘦、甜美角色，保留原圖構圖與背景，並自動加入合適的新海誠風格光影。
            </p>
        </header>

        <section class="mb-6 bg-slate-900/80 p-4 rounded-xl border border-slate-800/80 backdrop-blur-md gemini-glow">
            <label class="block text-xs font-medium text-sky-400 mb-1.5 flex items-center justify-between">
                <span>Google Gemini API Key</span>
                <a href="https://aistudio.google.com/" target="_blank" class="text-[11px] text-slate-500 hover:text-sky-400 underline">獲取金鑰</a>
            </label>
            <input type="password" id="gemini-key" placeholder="AIzaSy..."
                   class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs focus:outline-none focus:border-sky-500 text-slate-200">
            <p class="text-[10px] text-slate-500 mt-1">金鑰只存在此瀏覽器，不會寫入 GitHub。若出現 quota 錯誤，代表該 Key 的 Gemini 圖片生成額度不足或尚未開通。</p>
        </section>

        <div id="error-box" class="hidden mb-6 rounded-xl border border-rose-500/30 bg-rose-950/40 px-4 py-3 text-xs text-rose-100"></div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <section class="space-y-4 bg-slate-900/70 p-4 rounded-xl border border-slate-800/80 backdrop-blur-md">
                <div class="flex items-center justify-between gap-3">
                    <h2 class="text-sm font-semibold text-slate-100">原圖</h2>
                    <label class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-100 text-xs rounded-lg transition-colors cursor-pointer">
                        上傳圖片
                        <input type="file" id="photo-input" accept="image/*" class="hidden">
                    </label>
                </div>
                <div class="image-stage w-full bg-slate-950/60 border border-dashed border-slate-700 rounded-xl overflow-hidden flex items-center justify-center relative">
                    <div id="upload-hint" class="px-6 text-center space-y-2">
                        <p class="text-sm text-slate-300 font-medium">選擇一張人物照片</p>
                        <p class="text-xs text-slate-500">系統會自動讀取照片中的人物、姿勢、服裝、背景與光線資訊。</p>
                    </div>
                    <img id="source-preview" src="#" alt="原圖預覽" class="hidden w-full h-full object-contain">
                </div>
            </section>

            <section class="space-y-4 bg-slate-900/70 p-4 rounded-xl border border-slate-800/80 backdrop-blur-md">
                <div class="flex items-center justify-between gap-3">
                    <h2 class="text-sm font-semibold text-slate-100">生成圖</h2>
                    <button id="btn-dl" onclick="saveImage()" disabled class="px-3 py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-100 text-xs rounded-lg transition-colors cursor-pointer">下載</button>
                </div>
                <div class="image-stage w-full sky-bg border border-slate-800 rounded-xl overflow-hidden flex items-center justify-center relative">
                    <div id="loader" class="hidden text-center space-y-3 z-10">
                        <div class="mx-auto h-10 w-10 border-4 border-sky-400/20 border-t-sky-400 rounded-full animate-spin"></div>
                        <p class="text-xs text-sky-400 font-medium animate-pulse">正在分析原圖並生成新海誠風格光影...</p>
                    </div>
                    <div id="status-text" class="text-slate-500 text-xs text-center z-10">
                        <p class="font-medium text-slate-400">生成結果會出現在這裡</p>
                    </div>
                    <img id="out-img" src="#" alt="輸出結果" class="hidden w-full h-full object-contain z-10">
                </div>

                <div>
                    <label for="revision-note" class="block text-xs font-medium text-slate-300 mb-1.5">修正意見</label>
                    <textarea id="revision-note" rows="3" placeholder="例如：眼睛再甜美一點、光線更像黃昏、臉部更接近原圖、背景不要改太多"
                              class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs focus:outline-none focus:border-sky-500 text-slate-200 placeholder:text-slate-600"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button id="btn-redraw" onclick="runGeminiWorkflow(true)" disabled class="py-2.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-100 font-medium text-xs rounded-lg transition-colors cursor-pointer">依修正意見重畫</button>
                    <button id="btn-draw" onclick="runGeminiWorkflow(false)"
                            class="py-2.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-medium text-xs rounded-lg transition-all cursor-pointer">
                        開始生成
                    </button>
                </div>
            </section>
        </div>
    </div>

    <script>
        const MODEL_NAME = 'gemini-2.5-flash-image';

        // 自動載入已存金鑰
        document.addEventListener('DOMContentLoaded', () => {
            const k = localStorage.getItem('g_key');
            if (k) document.getElementById('gemini-key').value = k;
        });

        // 預覽上傳圖
        document.getElementById('photo-input').addEventListener('change', function(e) {
            const f = e.target.files[0];
            if (f) {
                hideError();
                resetOutput();
                const r = new FileReader();
                r.onload = function(ev) {
                    document.getElementById('upload-hint').classList.add('hidden');
                    const img = document.getElementById('source-preview');
                    img.src = ev.target.result;
                    img.classList.remove('hidden');
                }
                r.readAsDataURL(f);
            }
        });

        // 執行主程序
        async function runGeminiWorkflow(useRevision) {
            const key = document.getElementById('gemini-key').value.trim();
            const file = document.getElementById('photo-input').files[0];
            if (!key) return showError('請先填入 Gemini API Key。');
            if (!file) return showError('請先上傳一張人物照片。');

            localStorage.setItem('g_key', key);
            hideError();
            toggleUI(true);

            try {
                const base64Str = await file2Base64(file);
                const pureBase64 = base64Str.split(',')[1];
                const mimeType = base64Str.split(',')[0].split(';')[0].split(':')[1];
                const revisionNote = document.getElementById('revision-note').value.trim();

                // 架構多模態提示詞
                const promptText = buildPrompt(useRevision ? revisionNote : '');

                // 呼叫 Gemini Image Generation 端點
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': key
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inlineData: { mimeType: mimeType, data: pureBase64 } }
                            ]
                        }],
                        generationConfig: {
                            responseModalities: ['TEXT', 'IMAGE']
                        }
                    })
                });

                const data = await res.json();
                if (!res.ok) {
                    const message = formatApiError(data?.error?.message || `API 回應失敗，代碼: ${res.status}`);
                    throw new Error(message);
                }

                const parts = data?.candidates?.[0]?.content?.parts || [];
                const imagePart = parts.find(part => part.inlineData?.data);
                const textPart = parts.find(part => part.text)?.text;

                if (!imagePart) {
                    throw new Error(textPart || 'Gemini 沒有回傳圖片，請稍後重試或調整提示詞。');
                }

                const out = document.getElementById('out-img');
                const outputMimeType = imagePart.inlineData.mimeType || 'image/png';
                out.src = `data:${outputMimeType};base64,${imagePart.inlineData.data}`;
                out.classList.remove('hidden');
                document.getElementById('status-text').classList.add('hidden');
                document.getElementById('btn-dl').disabled = false;
                document.getElementById('btn-redraw').disabled = false;
                toggleUI(false);

            } catch (err) {
                showError(`運算發生問題：${err.message}`);
                toggleUI(false);
            }
        }

        function buildPrompt(revisionNote) {
            const revisionText = revisionNote
                ? `Additional revision request from the user: ${revisionNote}`
                : 'No additional revision request.';

            return `Analyze the uploaded image carefully and create a new image.

Main goal:
- Transform the person in the original photo into a cute, slim, sweet anime-style character.
- Preserve the original person's pose, outfit type, clothing colors, hairstyle impression, facial identity cues, accessories, background, camera angle, and composition as much as possible.
- Do not change the scene unless it is necessary for style consistency.
- Automatically infer the original lighting, weather, time of day, and mood from the image.
- Add cinematic anime lighting inspired by Makoto Shinkai: luminous sky glow, delicate rim light, soft atmospheric bloom, vivid but natural colors, reflective highlights, and emotional sunlight or skylight that suits the original image.
- Keep the final character tasteful, wholesome, and age-appropriate.
- Produce one polished illustration only. Do not add text, captions, watermarks, UI, frames, or comparison panels.

${revisionText}`;
        }

        function file2Base64(f) {
            return new Promise((res, rej) => {
                const r = new FileReader();
                r.onload = () => res(r.result);
                r.onerror = e => rej(e);
                r.readAsDataURL(f);
            });
        }

        function toggleUI(load) {
            document.getElementById('loader').classList.toggle('hidden', !load);
            if(load) document.getElementById('status-text').classList.add('hidden');
            document.getElementById('btn-draw').disabled = load;
            document.getElementById('btn-redraw').disabled = load || document.getElementById('out-img').classList.contains('hidden');
            document.getElementById('btn-draw').classList.toggle('opacity-50', load);
        }

        function resetOutput() {
            const out = document.getElementById('out-img');
            out.src = '#';
            out.classList.add('hidden');
            document.getElementById('status-text').classList.remove('hidden');
            document.getElementById('btn-dl').disabled = true;
            document.getElementById('btn-redraw').disabled = true;
        }

        function showError(message) {
            const box = document.getElementById('error-box');
            box.textContent = message;
            box.classList.remove('hidden');
        }

        function hideError() {
            const box = document.getElementById('error-box');
            box.textContent = '';
            box.classList.add('hidden');
        }

        function formatApiError(message) {
            if (/quota|rate-limit|rate limit|RESOURCE_EXHAUSTED/i.test(message)) {
                return 'Gemini 圖片生成額度不足或尚未開通。這不是照片或網頁設定錯誤；請稍後再試、換一組有圖片生成額度的 API Key，或到 Google AI Studio / Cloud Billing 檢查用量與方案。';
            }
            if (/API key|permission|PERMISSION_DENIED|unauthorized/i.test(message)) {
                return 'API Key 無效或沒有權限。請確認 Key 是否正確，並確認 Gemini API 已啟用。';
            }
            return message;
        }

        function saveImage() {
            const img = document.getElementById('out-img');
            const a = document.createElement('a');
            a.href = img.src; a.download = `gemini_shinkai_art_${Date.now()}.png`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }
    </script>
</body>
</html>
